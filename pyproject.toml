[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-discovery"
version = "0.1.0"
description = "Computational drug discovery pipeline for human acetylcholinesterase inhibitors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "chembl-webresource-client>=0.10.9",
]

[project.optional-dependencies]
eda = [
    "rdkit>=2023.9.1",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scipy>=1.11",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
cdd = "drug_discovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
